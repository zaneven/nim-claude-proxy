[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nim-claude-proxy"
version = "0.4.1"
description = "Dedicated NVIDIA NIM proxy with Multi-Key round-robin load balancing and Anthropic/OpenAI protocol transpilation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "loguru>=0.7.2",
    "jsonschema>=4.23.0",
]

[project.scripts]
nim-proxy = "nim_proxy.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nim_proxy"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]
